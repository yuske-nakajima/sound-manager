# pnpm 設定
# サプライチェーン攻撃対策: 公開から 7 日経過したバージョンのみインストールを許可
minimumReleaseAge: 10080
# 不正なサブ依存 (tarball, git 直指定等) をブロック
blockExoticSubdeps: true
# ライフサイクルスクリプトはホワイトリスト方式
allowBuilds:
  esbuild: false
overrides:
  vite@7: ">=7.3.7 <8"
  postcss@8: ">=8.5.23 <9"
  nanoid@3: ">=3.3.18 <4"
  esbuild: ">=0.28.1"
